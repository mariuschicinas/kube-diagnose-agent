name: security

on:
  push:
    branches: [main]
  pull_request:
  # New CVEs land against unchanged code, so scan on a schedule too.
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC

# Third-party actions are pinned to full commit SHAs (the version tag is kept
# as a comment for readability). A moving tag like @v4 can be re-pointed by the
# action's maintainer or an attacker who compromises them; a SHA cannot. Bump
# via Dependabot (.github/dependabot.yml) or by hand.
permissions:
  contents: read

jobs:
  supply-chain:
    name: supply chain scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
          check-latest: true

      # Fails if any module does not match its go.sum hash.
      - name: Verify module checksums
        run: go mod verify

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      # Reachability-aware: only fails on vulnerabilities actually callable from
      # this code. This gate is meant to be enforcing, not advisory.
      - name: govulncheck
        uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0
        with:
          go-version-input: "1.26"
          repo-checkout: false

      - name: Generate SBOM (CycloneDX)
        run: |
          go install github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@v1.12.0
          cyclonedx-gomod mod -json -output sbom.json

      - name: Upload SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-cyclonedx
          path: sbom.json

  posture:
    name: runtime posture checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # These greps are cheap regression tests for the security architecture.
      # They are here so that a future refactor cannot silently remove a control.
      - name: RBAC must contain no write verbs
        run: |
          # Inspect only the verbs: lines — not comments, which legitimately
          # mention write verbs when explaining their absence.
          for f in deploy/rbac.yaml deploy/rbac-namespaced.yaml; do
            if grep -E '^\s*verbs:' "$f" \
               | grep -Eq '(create|update|patch|delete|deletecollection|impersonate|escalate|bind)'; then
              echo "::error::$f grants a write verb — the agent must stay read-only"
              grep -nE '^\s*verbs:' "$f"
              exit 1
            fi
          done
          echo "OK: RBAC grants only read verbs"

      - name: RBAC must cover every resource the tools read
        run: |
          # internal/tools and internal/collect read these resources. A tool
          # that the ServiceAccount cannot actually use fails with 403 at
          # runtime; this catches the manifest drifting from the code.
          # Limitation: the resource list below is maintained by hand. When a
          # tool starts reading a new resource, add it here too. The check also
          # does not verify apiGroup or verb — review those in the manifest.
          for f in deploy/rbac.yaml deploy/rbac-namespaced.yaml; do
            for res in pods events pods/log services endpointslices deployments replicasets statefulsets daemonsets jobs; do
              grep -Eq "^\s*- ${res}\s*$" "$f" || {
                echo "::error::$f does not grant '${res}', which the agent reads"
                exit 1
              }
            done
          done
          echo "OK: RBAC covers every resource the agent reads"

      - name: Namespace allowlist must be enforced in tools
        run: |
          grep -q 'allowedNS' internal/tools/tools.go || {
            echo "::error::namespace allowlist missing from internal/tools — cross-namespace reads would be possible"
            exit 1
          }
          echo "OK: namespace allowlist present"

      - name: No exec/attach/portforward tool may exist
        run: |
          if grep -Eq '"(exec|attach|portforward)"' internal/tools/tools.go; then
            echo "::error::an exec-class tool was added — this breaks the read-only guarantee"
            exit 1
          fi
          echo "OK: no exec-class tools"

      - name: No tool may read Secret contents
        run: |
          # The tool surface is the blast radius. A tool that returns Secret
          # .Data into the model's context is an exfiltration path that no
          # namespace allowlist can close (the attacker just targets the
          # allowed namespace). Reading a Secret's .Data or .StringData is
          # therefore forbidden outright. Existence/metadata checks are fine.
          if grep -Eq '\.(Data|StringData)\b' internal/tools/tools.go \
             || grep -Eiq 'Secrets\([^)]*\)\.Get' internal/tools/tools.go; then
            echo "::error::a tool reads Secret contents — secret material must never enter the model context"
            grep -nE '\.(Data|StringData)\b|Secrets\([^)]*\)\.Get' internal/tools/tools.go
            exit 1
          fi
          echo "OK: no tool reads Secret contents"

      - name: Next steps must be filtered to read-only commands
        run: |
          # The prompt forbids exec/mutating commands as "next steps", but a
          # prompt rule is probabilistic. The deterministic filter in
          # internal/llm must stay wired into result parsing.
          grep -q 'enforceReadOnlySteps(&out)' internal/llm/llm.go || {
            echo "::error::read-only next-step filter is not applied to model results"
            exit 1
          }
          echo "OK: next steps are filtered to read-only commands"

      - name: Redaction must be applied to egress
        run: |
          grep -q 'redact.Scrub' internal/diagnose/diagnose.go || {
            echo "::error::bundle is not scrubbed before egress"
            exit 1
          }
          grep -q 'redact.Scrub' internal/tools/tools.go || {
            echo "::error::tool results are not scrubbed before returning to the model"
            exit 1
          }
          echo "OK: redaction applied to both bundle and tool results"
