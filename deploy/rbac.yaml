# Read-only RBAC for the diagnose agent. The agent can only get/list/watch the
# resources it needs to build a diagnostic bundle, and read pod logs. It has NO
# write/patch/delete/exec permissions anywhere. Read-only is enforced at the
# RBAC layer, not just in code — apply this and the worst a compromised agent
# can do is read.
#
# Apply: kubectl apply -f deploy/rbac.yaml
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: diagnose-agent
  namespace: diagnostics
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: diagnose-agent-readonly
rules:
  - apiGroups: [""]
    resources:
      - pods
      - events
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources:
      - pods/log
    verbs: ["get"]
  - apiGroups: ["apps"]
    resources:
      - deployments
      - replicasets
      - statefulsets
      - daemonsets
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources:
      - jobs
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: diagnose-agent-readonly
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: diagnose-agent-readonly
subjects:
  - kind: ServiceAccount
    name: diagnose-agent
    namespace: diagnostics
